name: CI

# Runs on every push and pull request. This is the "CI: build + lint" item
# from the proposal's first-iteration deliverable (Section 9.1) — it doesn't
# need real database or API credentials, since `next build` type-checks and
# bundles the app without ever executing the API routes' handlers.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # Dummy values so `next build` can resolve process.env references at
        # build time — no real secrets are needed since nothing here actually
        # calls the database, GitHub, or Gemini.
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          GITHUB_CLIENT_ID: ci-placeholder
          GITHUB_CLIENT_SECRET: ci-placeholder
          GITHUB_WEBHOOK_SECRET: ci-placeholder
          DATABASE_URL: postgres://user:pass@localhost:5432/db
          DATABASE_SSL: "false"
          GOOGLE_API_KEY: ci-placeholder
        run: npm run build
